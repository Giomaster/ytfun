name: AI Meow Original Audio
on:
  push:
    branches: ['codex/ai-original-studio']
    paths: ['studio/batches/audio-launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-meow-original-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: studio
      - uses: actions/github-script@v7
        env:
          AI_MEOW_AUDIO_PACKET: ${{ secrets.AI_MEOW_AUDIO_PACKET }}
        with:
          script: |
            const worker = await import(`${process.env.GITHUB_WORKSPACE}/studio/scripts/remote-audio-worker.mjs`);
            const result = await worker.runAudioWorker();
            core.info(`Original audio: ${result.scenes} scenes; artifact ${result.artifactId}; receipt ${result.manifestSha256}`);
