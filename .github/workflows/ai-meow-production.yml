name: AI Meow Remote Production
on:
  push:
    branches: ['codex/ai-original-studio']
    paths: ['studio/batches/launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-meow-paid-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          AI_MEOW_BATCH_PACKET: ${{ secrets.AI_MEOW_BATCH_PACKET }}
        run: node studio/scripts/remote-batch-prepare.mjs
  sphere:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: studio
      - name: Ensure media tools
        run: command -v ffmpeg >/dev/null || (timeout 90s sudo apt-get update -qq && timeout 90s sudo apt-get install -y -qq ffmpeg)
      - uses: actions/github-script@v7
        env:
          AI_MEOW_BATCH_PACKET: ${{ secrets.AI_MEOW_BATCH_PACKET }}
          HF_TOKEN: ${{ secrets.AI_MEOW_HF_TOKEN }}
          YTFUN_BATCH_PAID_ENABLED: 'true'
          SPHERE_INDEX: ${{ matrix.index }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const worker = await import(`${process.env.GITHUB_WORKSPACE}/studio/scripts/remote-batch-worker.mjs`);
            const result = await worker.runWorker();
            core.info(`Sphere ${result.index}: ${result.status}`);
